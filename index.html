<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vantage</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header id="title">
      <h1>Vantage</h1>
      <p>Drag to orbit · Scroll to zoom · Click a tile to start a word</p>
      <div id="view-buttons">
        <button id="iso" type="button">Isometric view</button>
        <button id="reveal" type="button" disabled>Reveal the trick</button>
        <button id="turn" type="button" title="Spend a turn rotating the blue ledge">Turn the ledge</button>
      </div>
    </header>

    <dl id="stats">
      <div><dt>Score</dt><dd id="score"></dd></div>
      <div><dt>Turns</dt><dd id="turns"></dd></div>
      <div><dt>Bag</dt><dd id="bag"></dd></div>
    </dl>

    <section id="status" aria-live="polite">
      <strong id="headline"></strong>
      <div id="pattern" hidden></div>
      <button id="switch-line" type="button" hidden>Switch line</button>
      <span id="hint"></span>
      <span id="message"></span>
    </section>

    <footer id="tray">
      <div id="rack" aria-label="Your letters"></div>
      <div id="actions">
        <button id="play" type="button">Play word <kbd>Enter</kbd></button>
        <button id="undo" type="button">Undo <kbd>⌫</kbd></button>
        <button id="cancel" type="button">Cancel <kbd>Esc</kbd></button>
      </div>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
