<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vantage</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header id="title">
      <h1>Vantage</h1>
      <p>Drag to orbit · Scroll to zoom · Click a tile to start a word</p>
      <div id="view-buttons">
        <button id="iso" type="button">Isometric view</button>
        <button id="reveal" type="button" disabled>Reveal the trick</button>
      </div>
    </header>

    <dl id="stats">
      <div><dt>Score</dt><dd id="score"></dd></div>
      <div><dt>Turns</dt><dd id="turns"></dd></div>
      <div><dt>Bag</dt><dd id="bag"></dd></div>
    </dl>

    <section id="status" aria-live="polite">
      <strong id="headline"></strong>
      <div id="pattern" hidden></div>
      <span id="hint"></span>
      <span id="message"></span>
    </section>

    <footer id="tray">
      <div id="rack" aria-label="Your letters"></div>
      <div id="actions">
        <button id="play" type="button">Play word <kbd>Enter</kbd></button>
        <button id="undo" type="button">Undo <kbd>⌫</kbd></button>
        <button id="cancel" type="button">Cancel <kbd>Esc</kbd></button>
      </div>
      <div id="turn-actions">
        <button id="swap" type="button" title="Send your letters back and earn new ones (uses a turn)">Swap</button>
        <button id="finish" type="button">Finish</button>
      </div>
    </footer>

    <section id="chamber" hidden aria-labelledby="chamber-title">
      <div class="chamber-card">
        <header>
          <h2 id="chamber-title">Hyperbolic Chamber</h2>
          <span id="chamber-round"></span>
        </header>
        <p id="chamber-prompt"></p>
        <div class="chamber-stage">
          <canvas id="chamber-canvas"></canvas>
          <div id="chamber-labels"></div>
        </div>
        <p id="chamber-result" aria-live="polite"></p>
        <button id="chamber-go" type="button" hidden></button>
      </div>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
